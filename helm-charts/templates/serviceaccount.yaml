{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mackllc-service.serviceAccountName" . }}
  labels:
    {{- include "mackllc-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | replace "<ACCOUNT_ID>" ($.Values.global.awsAccountId | toString) | nindent 4 }}
  {{- end }}
{{- end }}