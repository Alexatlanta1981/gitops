apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-service-dev
  namespace: argocd
  labels:
    env: dev
    app: catalog-service
    managed-by: terraform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mackllc

  source:
    repoURL: https://github.com/your-github-username/gitops.git
    targetRevision: HEAD
    path: helm-charts
    helm:
      parameters:
        - name: global.awsAccountId
          value: "your-aws-account-id"
      valueFiles:
        - ../envs/dev/values-catalog-service.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
